<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>質感感官遊戲 - 金色光滑面版</title>
    <style>
        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: '微軟正黑體', sans-serif;
        }

        .container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            width: 100vw; height: 100vh;
            gap: 20px; padding: 20px;
            box-sizing: border-box;
        }

        .texture-card {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            overflow: hidden;
            border: 10px solid rgba(255, 255, 255, 0.3);
            background-size: cover;
            background-position: center;
            box-shadow: inset 0 0 0 2000px rgba(0,0,0,0.4);
        }

        /* --- 質感視覺設計 --- */
        /* 毛毛 */
        #fur { background-color: #ff4081; background-image: radial-gradient(#f48fb1 30%, transparent 31%); background-size: 40px 40px; }
        /* 木材 */
        #wood { background-color: #795548; background-image: repeating-linear-gradient(90deg, #795548, #795548 15px, #5d4037 16px, #5d4037 30px); }
        
        /* 金屬 - 改為金色光滑面 */
        #metal {
            /* 使用多重線性漸層模擬黃金的光澤反射 */
            background: linear-gradient(135deg, #bf953f 0%, #fcf6ba 45%, #b38728 55%, #fbf5b7 100%);
            /* 增加一個暖色調的邊框 */
            border-color: #ffd700; 
        }

        /* 沙紙 */
        #sandpaper { background-color: #d7ccc8; background-image: radial-gradient(#8d6e63 10%, transparent 11%); background-size: 8px 8px; }

        .texture-card:hover {
            transform: scale(1.05);
            border-color: #fff;
            box-shadow: inset 0 0 0 2000px rgba(0,0,0,0.2);
        }

        .label {
            color: white;
            font-size: 5rem;
            font-weight: 900;
            /* 強烈的文字陰影，確保在金色背景上也清晰可見 */
            text-shadow: 4px 4px 15px rgba(0,0,0,1);
            z-index: 2;
            pointer-events: none;
        }

        #sandpaper .label { color: #3e2723; text-shadow: none; }

        /* 眼控進度圈 */
        .progress-ring {
            position: absolute;
            width: 260px; height: 260px;
            border: 15px solid rgba(255,255,255,0.2);
            border-top: 15px solid #ffeb3b;
            border-radius: 50%;
            display: none;
            animation: spin 1s linear infinite;
            z-index: 1;
        }

        @keyframes spin { 100% { transform: rotate(360deg); } }

        .active-animation { animation: pulse 0.6s ease; }
        @keyframes pulse {
            0% { transform: scale(1.05); }
            50% { transform: scale(1.2); border-color: #ffeb3b; }
            100% { transform: scale(1.05); }
        }
    </style>
</head>
<body>

<div class="container">
    <div id="fur" class="texture-card" onmouseenter="startDwell(this, 'fur')" onmouseleave="resetDwell(this)">
        <div class="progress-ring"></div>
        <div class="label">毛毛</div>
    </div>
    <div id="wood" class="texture-card" onmouseenter="startDwell(this, 'knock')" onmouseleave="resetDwell(this)">
        <div class="progress-ring"></div>
        <div class="label">木材</div>
    </div>
    <div id="metal" class="texture-card" onmouseenter="startDwell(this, 'metal')" onmouseleave="resetDwell(this)">
        <div class="progress-ring"></div>
        <div class="label">金屬</div>
    </div>
    <div id="sandpaper" class="texture-card" onmouseenter="startDwell(this, 'sand')" onmouseleave="resetDwell(this)">
        <div class="progress-ring"></div>
        <div class="label">沙紙</div>
    </div>
</div>

<script>
    let dwellTimer;
    const DWELL_TIME = 1000; 

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playSound(type) {
        const now = audioCtx.currentTime;
        const masterGain = audioCtx.createGain();
        masterGain.connect(audioCtx.destination);

        if (type === 'fur') {
            // 毛毛：音量平衡版 (0.8)
            const osc = audioCtx.createOscillator();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(160, now);
            masterGain.gain.setValueAtTime(0, now);
            masterGain.gain.linearRampToValueAtTime(0.8, now + 0.1);
            masterGain.gain.linearRampToValueAtTime(0, now + 0.6);
            osc.connect(masterGain);
            osc.start(); osc.stop(now + 0.6);

        } else if (type === 'knock') {
            // 木材：敲門聲 (咚-咚)
            const knock = (time) => {
                const osc = audioCtx.createOscillator();
                const g = audioCtx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(140, time);
                osc.frequency.exponentialRampToValueAtTime(60, time + 0.1);
                g.gain.setValueAtTime(0.8, time);
                g.gain.exponentialRampToValueAtTime(0.01, time + 0.12);
                osc.connect(g); g.connect(masterGain);
                osc.start(time); osc.stop(time + 0.15);
            };
            knock(now); knock(now + 0.25);

        } else if (type === 'metal') {
            // 金屬：清脆叮一聲
            const osc = audioCtx.createOscillator();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(1500, now);
            masterGain.gain.setValueAtTime(0.5, now);
            masterGain.gain.exponentialRampToValueAtTime(0.01, now + 0.8);
            osc.connect(masterGain);
            osc.start(); osc.stop(now + 0.8);

        } else if (type === 'sand') {
            // 沙紙：一聲短促的摩擦聲
            const bufferSize = audioCtx.sampleRate * 0.3;
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
            
            const source = audioCtx.createBufferSource();
            source.buffer = buffer;
            
            const filter = audioCtx.createBiquadFilter();
            filter.type = 'bandpass'; 
            filter.frequency.value = 1000;
            filter.Q.value = 1.5;

            masterGain.gain.setValueAtTime(0, now);
            masterGain.gain.linearRampToValueAtTime(0.6, now + 0.05);
            masterGain.gain.linearRampToValueAtTime(0, now + 0.3);
            
            source.connect(filter);
            filter.connect(masterGain);
            source.start();
        }
    }

    function startDwell(element, soundType) {
        const ring = element.querySelector('.progress-ring');
        ring.style.display = 'block';
        dwellTimer = setTimeout(() => {
            playSound(soundType);
            element.classList.add('active-animation');
            ring.style.display = 'none';
            setTimeout(() => element.classList.remove('active-animation'), 600);
        }, DWELL_TIME);
    }

    function resetDwell(element) {
        clearTimeout(dwellTimer);
        element.querySelector('.progress-ring').style.display = 'none';
    }

    window.addEventListener('mousedown', () => { if (audioCtx.state === 'suspended') audioCtx.resume(); }, { once: true });
</script>

</body>
</html>
