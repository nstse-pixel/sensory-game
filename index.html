<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>感官遊戲 - 音量精調版</title>
    <style>
        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: '微軟正黑體', sans-serif;
            touch-action: none;
            -webkit-user-select: none;
        }

        /* 啟動畫面：解除 iPad 聲音鎖定 */
        #overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95);
            display: flex; justify-content: center; align-items: center;
            z-index: 100; color: white; cursor: pointer;
        }
        .start-btn {
            padding: 35px 70px; font-size: 3.5rem; background: #ffeb3b;
            color: black; border-radius: 40px; font-weight: bold;
            box-shadow: 0 0 40px rgba(255,235,59,0.6);
        }

        .container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            width: 100vw; height: 100vh;
            gap: 15px; padding: 15px;
            box-sizing: border-box;
        }

        .texture-card {
            position: relative;
            display: flex; justify-content: center; align-items: center;
            border-radius: 50px;
            overflow: hidden;
            border: 10px solid rgba(255, 255, 255, 0.3);
            background-size: cover;
            background-position: center;
            box-shadow: inset 0 0 0 2000px rgba(0,0,0,0.4);
            transition: transform 0.2s;
        }

        /* --- 質感視覺設計 --- */
        #fur { background-color: #ff4081; background-image: radial-gradient(#f48fb1 30%, transparent 31%); background-size: 40px 40px; }
        #wood { background-color: #795548; background-image: repeating-linear-gradient(90deg, #795548, #795548 15px, #5d4037 16px, #5d4037 30px); }
        #metal { background: linear-gradient(135deg, #bf953f 0%, #fcf6ba 45%, #b38728 55%, #fbf5b7 100%); border-color: #ffd700; }
        #sandpaper { background-color: #d7ccc8; background-image: radial-gradient(#8d6e63 10%, transparent 11%); background-size: 10px 10px; }

        /* 互動效果 */
        .active-dwell { transform: scale(1.02); border-color: #fff; box-shadow: inset 0 0 0 2000px rgba(0,0,0,0.2); }

        .label {
            color: white; font-size: 5rem; font-weight: 900;
            text-shadow: 4px 4px 15px rgba(0,0,0,1); z-index: 2;
            pointer-events: none;
        }
        #sandpaper .label { color: #3e2723; text-shadow: none; }

        /* 進度圈 */
        .progress-ring {
            position: absolute; width: 260px; height: 260px;
            border: 18px solid rgba(255,255,255,0.2);
            border-top: 18px solid #ffeb3b;
            border-radius: 50%; display: none;
            animation: spin 1s linear infinite; z-index: 1;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        .active-animation { animation: pulse 0.6s ease; }
        @keyframes pulse {
            0% { transform: scale(1.02); }
            50% { transform: scale(1.15); border-color: #ffeb3b; }
            100% { transform: scale(1.02); }
        }
    </style>
</head>
<body>

<div id="overlay" onclick="initGame()">
    <div class="start-btn">點擊開始遊戲</div>
</div>

<div class="container">
    <div id="fur" class="texture-card" 
         onmouseenter="startDwell(this, 'fur')" onmouseleave="resetDwell(this)"
         ontouchstart="startDwell(this, 'fur')" ontouchend="resetDwell(this)">
        <div class="progress-ring"></div>
        <div class="label">毛毛</div>
    </div>
    <div id="wood" class="texture-card" 
         onmouseenter="startDwell(this, 'knock')" onmouseleave="resetDwell(this)"
         ontouchstart="startDwell(this, 'knock')" ontouchend="resetDwell(this)">
        <div class="progress-ring"></div>
        <div class="label">木材</div>
    </div>
    <div id="metal" class="texture-card" 
         onmouseenter="startDwell(this, 'metal')" onmouseleave="resetDwell(this)"
         ontouchstart="startDwell(this, 'metal')" ontouchend="resetDwell(this)">
        <div class="progress-ring"></div>
        <div class="label">金屬</div>
    </div>
    <div id="sandpaper" class="texture-card" 
         onmouseenter="startDwell(this, 'sand')" onmouseleave="resetDwell(this)"
         ontouchstart="startDwell(this, 'sand')" ontouchend="resetDwell(this)">
        <div class="progress-ring"></div>
        <div class="label">沙紙</div>
    </div>
</div>

<script>
    let dwellTimer;
    const DWELL_TIME = 1000; 
    let audioCtx;

    function initGame() {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        document.getElementById('overlay').style.display = 'none';
    }

    function playSound(type) {
        if (!audioCtx) return;
        const now = audioCtx.currentTime;
        const masterGain = audioCtx.createGain();
        masterGain.connect(audioCtx.destination);

        if (type === 'fur') {
            // 毛毛音量：調大至 1.1
            const osc = audioCtx.createOscillator();
            osc.type = 'sine'; osc.frequency.setValueAtTime(160, now);
            masterGain.gain.setValueAtTime(0, now);
            masterGain.gain.linearRampToValueAtTime(1.1, now + 0.1); 
            masterGain.gain.linearRampToValueAtTime(0, now + 0.7);
            osc.connect(masterGain); osc.start(); osc.stop(now + 0.7);

        } else if (type === 'knock') {
            // 木材音量：保持 0.8 基頻
            const knock = (time) => {
                const osc = audioCtx.createOscillator();
                const g = audioCtx.createGain();
                osc.type = 'triangle'; osc.frequency.setValueAtTime(140, time);
                osc.frequency.exponentialRampToValueAtTime(60, time + 0.1);
                g.gain.setValueAtTime(0.8, time);
                g.gain.exponentialRampToValueAtTime(0.01, time + 0.12);
                osc.connect(g); g.connect(masterGain);
                osc.start(time); osc.stop(time + 0.15);
            };
            knock(now); knock(now + 0.25);

        } else if (type === 'metal') {
            // 金屬音量：保持 0.35
            const osc = audioCtx.createOscillator();
            osc.type = 'sine'; osc.frequency.setValueAtTime(1500, now);
            masterGain.gain.setValueAtTime(0.35, now);
            masterGain.gain.exponentialRampToValueAtTime(0.01, now + 0.8);
            osc.connect(masterGain); osc.start(); osc.stop(now + 0.8);

        } else if (type === 'sand') {
            // 沙紙音量：再次調低至 0.25
            const bufferSize = audioCtx.sampleRate * 0.3;
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
            const source = audioCtx.createBufferSource();
            source.buffer = buffer;
            const filter = audioCtx.createBiquadFilter();
            filter.type = 'bandpass'; filter.frequency.value = 1000;
            masterGain.gain.setValueAtTime(0, now);
            masterGain.gain.linearRampToValueAtTime(0.25, now + 0.05); // 更輕柔的音量
            masterGain.gain.linearRampToValueAtTime(0, now + 0.3);
            source.connect(filter); filter.connect(masterGain);
            source.start();
        }
    }

    function startDwell(element, soundType) {
        element.classList.add('active-dwell');
        const ring = element.querySelector('.progress-ring');
        ring.style.display = 'block';
        clearTimeout(dwellTimer);
        
        dwellTimer = setTimeout(() => {
            playSound(soundType);
            element.classList.add('active-animation');
            ring.style.display = 'none';
            setTimeout(() => {
                element.classList.remove('active-animation');
                element.classList.remove('active-dwell');
            }, 600);
        }, DWELL_TIME);
    }

    function resetDwell(element) {
        clearTimeout(dwellTimer);
        element.classList.remove('active-dwell');
        const ring = element.querySelector('.progress-ring');
        ring.style.display = 'none';
    }

    window.oncontextmenu = function(event) { event.preventDefault(); return false; };
</script>

</body>
</html>
